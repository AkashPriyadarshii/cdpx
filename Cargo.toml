[package]
name = "cdpx"
version = "0.1.0"
edition = "2024"
authors = ["Akash Priyadarshi <https://github.com/AkashPriyadarshii>"]
description = "Driverless, token-compressed Chrome DevTools Protocol browser controller and stdio MCP server for AI agents"
license = "MIT"
repository = "https://github.com/AkashPriyadarshii/cdpx"
readme = "README.md"
keywords = ["cdp", "browser-automation", "mcp", "ai-agent", "playwright-alternative"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
tokio = { version = "1.43", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
which = "7.0"
url = "2.5"
tempfile = "3.17"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
