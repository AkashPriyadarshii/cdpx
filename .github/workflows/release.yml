name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        run: |
          VERSION=$(grep -m 1 '^version = ' Cargo.toml | cut -d '"' -f 2)
          echo "Current version: $VERSION"
          
          # Check if tag already exists in remote
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists locally. Skipping release."
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "v$VERSION"; then
            echo "Tag v$VERSION already exists on remote. Skipping release."
            echo "should_release=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if version was bumped in the last commit
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            PREV_VERSION=$(git show HEAD~1:Cargo.toml 2>/dev/null | grep -m 1 '^version = ' | cut -d '"' -f 2 || echo "")
            echo "Previous version: $PREV_VERSION"
            if [ "$VERSION" != "$PREV_VERSION" ]; then
              echo "Version bumped ($PREV_VERSION -> $VERSION). Triggering release."
              echo "should_release=true" >> $GITHUB_OUTPUT
              echo "version=$VERSION" >> $GITHUB_OUTPUT
              exit 0
            else
              echo "Version unchanged. Cancelling release run."
              echo "should_release=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          else
            echo "No previous commit to compare. Releasing."
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

  build-and-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: cdpx-x86_64-unknown-linux-gnu.tar.gz
            binary: cdpx
            use_cross: false

          # Linux i686 (x86 32-bit)
          - target: i686-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: cdpx-i686-unknown-linux-gnu.tar.gz
            binary: cdpx
            use_cross: true

          # Linux aarch64 (ARM64)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: cdpx-aarch64-unknown-linux-gnu.tar.gz
            binary: cdpx
            use_cross: true

          # macOS Apple Silicon (arm64)
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: cdpx-aarch64-apple-darwin.tar.gz
            binary: cdpx
            use_cross: false

          # macOS Intel (x86_64)
          - target: x86_64-apple-darwin
            os: macos-13
            artifact_name: cdpx-x86_64-apple-darwin.tar.gz
            binary: cdpx
            use_cross: false

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: cdpx-x86_64-pc-windows-msvc.zip
            binary: cdpx.exe
            use_cross: false

          # Windows i686 (x86 32-bit)
          - target: i686-pc-windows-msvc
            os: windows-latest
            artifact_name: cdpx-i686-pc-windows-msvc.zip
            binary: cdpx.exe
            use_cross: false

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if needed)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package Linux / macOS
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../${{ matrix.artifact_name }} ${{ matrix.binary }}
        shell: bash

      - name: Package Windows
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../${{ matrix.artifact_name }} ${{ matrix.binary }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    needs: [check-version, build-and-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create Git Tag and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION" || true
          
          gh release create "v$VERSION" dist/* \
            --title "cdpx v$VERSION" \
            --notes "Release v$VERSION with automated multi-arch pre-compiled binaries for Linux (x86_64, i686, aarch64), macOS (Apple Silicon arm64, Intel x86_64), and Windows (x86_64, i686)."
